<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat & Games</title>
<style>
  :root { --bg:#f4f4f6; --fg:#1a1a1f; --btn:#4f46e5; --btn-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14141a; --fg:#f0f0f5; --btn:#6366f1; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    display:flex; align-items:center; justify-content:center; gap:20px;
    background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .open-btn {
    padding:18px 44px; font-size:1.3rem; font-weight:600;
    border:none; border-radius:12px; cursor:pointer;
    background:var(--btn); color:var(--btn-fg);
    transition:transform .1s, opacity .2s;
  }
  .open-btn:hover { opacity:.9; transform:translateY(-2px); }

  .overlay { display:none; position:fixed; inset:0; z-index:1000; background:#000; }
  .overlay.active { display:block; }
  .overlay iframe { width:100%; height:100%; border:0; }
</style>
</head>
<body>

<button class="open-btn" data-target="chat">Chat</button>
<button class="open-btn" data-target="games">Games</button>

<div class="overlay" id="chat">
  <!-- Change the src to your chat URL -->
  <iframe data-src="https://example.com" title="Chat" allow="fullscreen; microphone; camera"></iframe>
</div>

<div class="overlay" id="games">
  <!-- Change the src to your games URL -->
  <iframe data-src="https://example.com" title="Games" allow="fullscreen; gamepad; autoplay"></iframe>
</div>

<script>
  const overlays = document.querySelectorAll('.overlay');

  function closeAll() { overlays.forEach(o => o.classList.remove('active')); }

  document.querySelectorAll('.open-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      closeAll();
      const overlay = document.getElementById(btn.dataset.target);
      const frame = overlay.querySelector('iframe');
      if (!frame.src) frame.src = frame.dataset.src; // load on first open
      overlay.classList.add('active');
    });
  });

  document.addEventListener('keydown', e => { if (e.key === '') closeAll(); });
</script>
</body>
</html>
